# SonarCloud — CI-based analysis (issue #133, ADR-0007).
#
# Prerequisites (one-time, by repo owner):
#   1. SonarCloud → My Account → Security → generate token.
#   2. Repo Settings → Secrets → Actions → add SONAR_TOKEN.
#   3. SonarCloud project → Administration → Analysis Method →
#      disable Automatic Analysis (conflicts with CI-based scanning).
#
# The project already exists: imported via Automatic Analysis on 2026-08-24.

sonar.projectKey=chriguschneider_hass-meteoswiss-radar
sonar.organization=chriguschneider

sonar.sources=custom_components
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.mjs,tests/**/test_*.py

# Exclude vendored third-party code and test fixtures from analysis.
# Fixtures are binary-format payloads used by the decoder tests; they
# have no lines of logic to measure and would inflate the uncovered total.
sonar.exclusions=custom_components/meteoswiss_radar/frontend/vendor/**,tests/fixtures/**

# JS coverage: the card is loaded via node:vm in tests. V8 cannot attribute
# execution inside a vm context back to the source file, so npm run coverage
# reports 0 % for the card. Uploading a fake 0 % would hide real regressions,
# so the lcov path is intentionally omitted until a vm-compatible coverage
# mechanism is available (tracked in issue #133).
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Python coverage: pytest --cov produces coverage.xml (issue #133).
sonar.python.coverage.reportPaths=coverage.xml

# Non-runtime helpers excluded from coverage measurement:
#   tests/tools/ — smoke-test and reference-decode scripts run outside pytest
#   config_flow.py — boilerplate HA config flow; not exercised by unit tests
sonar.coverage.exclusions=tests/tools/**,custom_components/meteoswiss_radar/config_flow.py
