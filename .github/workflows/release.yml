name: Release

# ADR-0004: a pushed tag must not become a release on its own. Two ways a
# manual release has gone wrong here before, both caught by this gate:
#
#   - 0.7.6 and 0.8.0 were tagged 19 minutes apart with identical titles.
#   - v0.11.0 was tagged before the brand/ folder landed (#84), so the
#     published release shipped no icon while master claimed it did.
#
# The tag is therefore checked against the tree it actually points at, and
# release notes must already exist in CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify tag and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The annotated tag object carries the release title (see below),
          # and it is not present in a shallow clone of the commit alone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pytest

      # File-to-file version sync and "a changelog section exists for the
      # declared version" are already asserted by the test suite. Reuse it
      # rather than re-deriving five version strings in shell.
      - name: Version files and changelog agree
        run: pytest -q tests/test_metadata.py tests/test_changelog.py

      - name: Tag matches the declared version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          declared="$(python -c 'import json,pathlib;print(json.loads(pathlib.Path("custom_components/meteoswiss_radar/manifest.json").read_text(encoding="utf-8"))["version"])')"
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $tag declares version $version, but manifest.json says $declared."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::A release for ${{ steps.version.outputs.tag }} already exists. Delete it first, or tag a new version."
            exit 1
          fi

      - name: Extract the changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Both header forms occur: bare up to 0.8.0, v-prefixed from v0.9.0
          # onward (ADR-0004). tests/test_changelog.py accepts both too.
          # Stops at the next section header, at the link-definition block
          # that closes the file, or at EOF -- otherwise the oldest section
          # would swallow every "[x.y.z]: https://..." line below it.
          pattern = (
              rf"^## \[v?{re.escape(version)}\][^\n]*\n"
              r"(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)"
          )
          match = re.search(pattern, text, re.S | re.M)
          if match is None:
              sys.exit(f"::error::CHANGELOG.md has no '## [{version}]' section.")
          notes = match.group(1).strip()
          if not notes:
              sys.exit(f"::error::The '## [{version}]' section in CHANGELOG.md is empty.")
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print(f"Extracted {len(notes.splitlines())} lines of release notes.")
          PY

      # Releases here are titled "<tag> — <what changed>" (e.g. "v0.11.0 —
      # radar overlay layers"). Nothing in the repo can derive that phrase,
      # so it comes from the annotated tag's own message:
      #     git tag -a v0.13.0 -m "what changed"
      #
      # Read via the API, not `git tag -l`, because the checked-out ref is
      # not the tag we pushed. actions/checkout fetches the real tags and
      # then force-overwrites the one it wants with the resolved commit:
      #
      #   fetch ... +refs/tags/*:refs/tags/*
      #   fetch --no-tags ... +<commit-sha>:refs/tags/v0.13.0     <-- clobbers
      #
      # so `git cat-file -t v0.13.0` reports `commit` locally even for an
      # annotated tag, and the message is unreachable. v0.13.0 shipped titled
      # bare because of this.
      #
      # Only annotated tags carry a subject: for a lightweight one the API
      # returns object.type == "commit", and `git tag -l` would have fallen
      # through to the *commit* subject, titling 0.8.0 "chore(release): 0.8.0,
      # and cover package.json in the version-sync test (#65)".
      - name: Build the release title
        id: title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          object_type="$(gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq '.object.type')"
          subject=""
          if [ "$object_type" = "tag" ]; then
            object_sha="$(gh api "repos/${{ github.repository }}/git/ref/tags/$tag" --jq '.object.sha')"
            subject="$(gh api "repos/${{ github.repository }}/git/tags/$object_sha" --jq '.message' | head -1)"
          fi
          # Tolerate a message that already repeats the tag, so
          # `-m "v0.13.0 — foo"` yields one "v0.13.0 —", not two.
          subject="${subject#"$tag"}"
          subject="${subject#" — "}"
          subject="${subject#" - "}"
          subject="${subject#": "}"
          subject="${subject#" "}"
          if [ -n "$subject" ]; then
            title="$tag — $subject"
          else
            title="$tag"
          fi
          echo "Tag object type: $object_type"
          echo "Release title: $title"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      # ADR-0008. HACS increments a release's download counter only when it
      # pulls a release *asset*, and it only does that when hacs.json sets
      # zip_release with a .zip filename -- see should_try_releases in HACS'
      # repositories/base.py. Without it an integration is installed by
      # walking the repo tree, so the counter stays at zero however many
      # people install. That is what happened to 0.7.6 through v0.13.0.
      #
      # Layout matters: the zip holds the *contents* of the integration
      # directory at its root, not the directory itself. HACS extracts it
      # straight into custom_components/<domain>/, so a wrapper folder would
      # land as custom_components/meteoswiss_radar/meteoswiss_radar/ and no
      # install would work. Verified against a working example
      # (yandex_pogoda.zip) before adopting this.
      - name: Package the integration
        run: |
          set -euo pipefail
          cd custom_components/meteoswiss_radar
          # -X drops extra file attributes, keeping the archive reproducible.
          # __pycache__ can exist by now: the test step above ran pytest.
          zip -r -X "$GITHUB_WORKSPACE/meteoswiss_radar.zip" . \
            -x '*__pycache__*' -x '*.pyc'

      - name: Verify the zip layout
        run: |
          set -euo pipefail
          unzip -l meteoswiss_radar.zip
          # manifest.json at the root is what makes this a valid integration
          # payload; its absence means the wrapper mistake above.
          # Normalise a possible './' prefix: Info-ZIP may or may not store
          # it depending on version, and it is harmless. The mistake worth
          # failing on is a wrapper directory, not a dot-slash.
          if ! unzip -Z1 meteoswiss_radar.zip | sed 's|^\./||' | grep -qx 'manifest.json'; then
            echo "::error::manifest.json is not at the root of the zip."
            exit 1
          fi
          if unzip -Z1 meteoswiss_radar.zip | grep -q '__pycache__'; then
            echo "::error::__pycache__ leaked into the release asset."
            exit 1
          fi

      # The zip is the asset HACS downloads (hacs.json: zip_release +
      # filename). The repo tree stays the fallback for default-branch
      # installs, which HACS never serves from a release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.title.outputs.title }}" \
            --notes-file release-notes.md \
            --verify-tag \
            meteoswiss_radar.zip
