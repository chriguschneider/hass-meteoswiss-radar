name: SonarCloud

# ADR-0007 decided this workflow, but it was never created: #134 shipped
# sonar-project.properties, the ADR and the README badge without it, so
# nothing ever ran the scanner and the badge read "Quality gate not
# computed". This is that missing piece.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud quality gate
    runs-on: ubuntu-latest
    # GitHub withholds repository secrets from `pull_request` runs on a fork,
    # so SONAR_TOKEN is empty there and the scanner cannot authenticate -- the
    # job failed with "Not authorized or project not found" on every outside
    # contribution (#201, first seen on #190). Skip rather than fail: a red X
    # nobody can clear reads like the contributor's mistake. `pull_request_target`
    # would supply the secret but runs untrusted code with it in scope, so fork
    # PRs are analysed after merge, on master, instead.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud needs full history to attribute new code correctly;
          # a shallow clone makes every line look new.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pytest pytest-cov

      # Coverage is the reason this runs in CI at all: Automatic Analysis
      # cannot accept externally produced reports.
      - name: Pytest with coverage
        run: pytest -q --cov=custom_components --cov-report=xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # The card holds ~2200 of the project's coverable lines. Without this
      # the scanner finds no lcov, reports the whole file as uncovered, and
      # the gate fails on new_coverage no matter how good the Python side is.
      - name: Vitest with coverage
        run: npm run coverage

      # Sonar only *warns* when a configured report path is missing, so a
      # silently absent lcov would look like "the card is untested" rather
      # than "the report never got written". Fail here instead.
      - name: Assert the JS coverage report exists
        run: |
          set -euo pipefail
          if [ ! -s coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info is missing or empty; sonar-project.properties expects it."
            exit 1
          fi
          echo "lcov.info: $(wc -l < coverage/lcov.info) lines"

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Block the job on a failing gate rather than reporting green
          # while the badge says otherwise.
          args: -Dsonar.qualitygate.wait=true
